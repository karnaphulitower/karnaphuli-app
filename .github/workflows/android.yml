name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Signing key (from GitHub secrets, if set)
        env: { KS_B64: '${{ secrets.KS_B64 }}' }
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kt.jks"; echo "KT_KS=$RUNNER_TEMP/kt.jks" >> $GITHUB_ENV; else echo "No KS_B64 secret: debug signing (test only)"; fi
      - name: Build APK
        working-directory: android
        env:
          KT_VCODE: ${{ github.run_number }}
          KT_VNAME: 2.0.${{ github.run_number }}
          KT_KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle --no-daemon assembleRelease
      - name: Rename (version + Dhaka date/time in file name)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          STAMP=$(TZ=Asia/Dhaka date +%Y-%m-%d_%H-%M)
          NAME="KarnafullyTower-v2.0.${{ github.run_number }}-${STAMP}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk karnaphuli.apk
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK_NAME=$NAME" >> $GITHUB_ENV
          for x in $(gh release view android-latest --repo ${{ github.repository }} --json assets -q '.assets[].name' 2>/dev/null | grep '^KarnafullyTower-' || true); do gh release delete-asset android-latest "$x" --repo ${{ github.repository }} -y || true; done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android app (latest)
          body: "Karnafully Tower Android app — ${{ env.APK_NAME }}"
          prerelease: false
          make_latest: true
          files: |
            karnaphuli.apk
            ${{ env.APK_NAME }}
      - name: Move tag to this build
        run: |
          git tag -f android-latest
          git push -f origin android-latest
